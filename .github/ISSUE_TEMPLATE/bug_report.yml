name: Bug Report
description: Report a bug in the ALCops Azure DevOps extension
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Before you create a new issue, please:
        🔎 **Search [existing issues](https://github.com/ALCops/azure-devops-extension/issues)** to avoid duplicates.
        ✅ **Try reproducing on the [latest version](https://marketplace.visualstudio.com/items?itemName=Arthurvdv.alcops-ado)** of the ALCops extension.

        > [!IMPORTANT]
        > Is your issue about an **analyzer rule or diagnostic** (false positive, false negative, or crash in PlatformCop, LinterCop, ApplicationCop, ...)?
        > Those live in a different repository — please file it in [ALCops/Analyzers](https://github.com/ALCops/Analyzers/issues/new/choose) instead.
        > This repository is only for the Azure DevOps pipeline tasks that download and install the analyzers.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, ideally including the relevant part of your pipeline YAML.
      placeholder: |
        1. Add task '...' to the pipeline
        2. Run the pipeline
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.
      placeholder: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened.
      placeholder: Actual behavior
    validations:
      required: true

  - type: textarea
    id: pipeline-yaml
    attributes:
      label: Pipeline YAML
      description: The relevant task snippet from your pipeline. This will be automatically formatted as YAML.
      render: yaml
    validations:
      required: false

  - type: input
    id: extension-version
    attributes:
      label: ALCops extension version
      description: The extension version, shown in the pipeline log of the task.
      placeholder: e.g., 1.3.3
    validations:
      required: true

  - type: dropdown
    id: agent-type
    attributes:
      label: Agent type
      description: What kind of build agent are you using?
      options:
        - Microsoft-hosted
        - Self-hosted
    validations:
      required: true

  - type: input
    id: agent-os
    attributes:
      label: Agent OS / image
      description: The agent operating system or pipeline image.
      placeholder: e.g., windows-latest, ubuntu-24.04, self-hosted Windows Server 2022
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Pipeline logs
      description: Relevant log output from the failing task. Tip, re-run the pipeline with the variable `system.debug` set to `true` for verbose logs. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any additional information that might help, such as screenshots.
      placeholder: Additional context
    validations:
      required: false
